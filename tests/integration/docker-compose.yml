services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ktayl_policy_test
      POSTGRES_USER:     ktayl
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktayl -d ktayl_policy_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4223:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 10
