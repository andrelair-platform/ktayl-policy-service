name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/ktayl-policy-service
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── L1 — unit tests + security ─────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true

      - name: Run unit tests
        run: go test -v -race -count=1 ./...

      - name: Coverage gate (70% on domain + api)
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=./internal/domain/...,./internal/api/... \
            ./...
          PCT=$(go tool cover -func=coverage.out \
            | awk '/^total:/ {gsub(/%/,"",$3); print int($3)}')
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 70 ]; then
            echo "Coverage ${PCT}% < 70% — failing"
            exit 1
          fi

      - name: Vulnerability check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity high -confidence medium ./...

  # ── Build + push to Harbor ─────────────────────────────────────────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest:    ${{ steps.build.outputs.digest }}
      branch:    ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then TAG="${SHA}"; else TAG="${BRANCH}-${SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
          build-args: CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — staging + main only)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

  # ── GitOps bump (dev overlay) ──────────────────────────────────────────────
  # Overlay created in S010. This job skips gracefully if the path doesn't exist.
  bump-gitops:
    needs: build-and-push
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token:      ${{ secrets.GITOPS_TOKEN }}

      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key:    ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.6.0"

      - name: Bump dev overlay
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          SHA="${{ needs.build-and-push.outputs.image_tag }}"
          OVERLAY="services/ktayl-policy-service/minicloud-1/dev"
          if [ ! -d "$OVERLAY" ]; then
            echo "Overlay $OVERLAY not yet created (pending S010) — skipping bump"
            exit 0
          fi
          BRANCH="ci/ktayl-policy-service-${SHA}"
          git checkout -b "${BRANCH}"
          cd "$OVERLAY"
          kustomize edit set image \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHA}
          cd -
          git add "${OVERLAY}/kustomization.yaml"
          if git diff --cached --quiet; then exit 0; fi
          git commit -S -m "ci(ktayl-policy-service): bump dev to ${SHA}"
          git push origin "${BRANCH}"
          gh pr create \
            --repo ${{ env.GITOPS_REPO }} \
            --base main --head "${BRANCH}" \
            --title "ci(ktayl-policy-service): bump dev to ${SHA}" \
            --body "Automated image bump from CI run ${{ github.run_id }}."
          gh pr merge "${BRANCH}" \
            --repo ${{ env.GITOPS_REPO }} \
            --admin --merge --delete-branch
