name: CI

on:
  # main-only: Kargo owns dev→prod promotion + dev verification (fully cut over — no
  # dev-branch/bump-gitops track). dev iteration is local/preview, not a deployed track.
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY:   harbor.10.0.0.200.nip.io
  IMAGE_NAME: library/ktayl-policy-service
  GHCR_IMAGE: ghcr.io/andrelair-platform/ktayl-policy-service   # prod images (immutable SHA, durable)
  GITOPS_REPO: andrelair-platform/minicloud-gitops

jobs:
  # ── L0 — lint ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

  # ── L1 — unit tests + security ─────────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true

      - name: Run unit tests
        run: go test -v -race -count=1 ./...

      - name: Coverage gate (70% on domain + api)
        run: |
          go test -race -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=./internal/domain/...,./internal/api/... \
            ./...
          PCT=$(go tool cover -func=coverage.out \
            | awk '/^total:/ {gsub(/%/,"",$3); print int($3)}')
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 70 ]; then
            echo "Coverage ${PCT}% < 70% — failing"
            exit 1
          fi

      - name: Vulnerability check (govulncheck)
        run: |
          # Pinned (not @latest): govulncheck v1.8.0 requires Go >= 1.26, but CI runs Go 1.25
          # with GOTOOLCHAIN=local, so @latest fails to install. v1.1.4 builds on Go 1.25 and the
          # vuln DB is queried live regardless of tool version.
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Static security analysis (gosec)
        run: |
          # Pinned (not @latest) for reproducible builds — 12-factor #2 (Renovate bumps it via PR).
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity high -confidence medium ./...

  # ── Schema docs drift-check: the committed ERD must match the golang-migrate SQL ──
  # Applies db/migrations/*.up.sql (golang-migrate, raw SQL) to an EPHEMERAL Postgres, then
  # reverse-engineers docs/data-model with the digest-pinned tbls and fails if it drifted. Same
  # source of truth as prod (the migrations). "Docs can't lie." Pattern + determinism gotchas:
  # developer-platform/schema-erd-autogenerated (ref impls ktayl-core/claims/underwriting/iam).
  # PINNED: postgres:17.4 (tbls embeds database_version) + x86_64 baseline + tbls digest + explicit flags.
  # public schema; golang-migrate's schema_migrations table excluded via .tbls.yml.
  schema-erd-drift:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.4
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: ktayl_policy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: pw
      TBLS_DSN: "postgres://postgres:pw@localhost:5432/ktayl_policy?sslmode=disable"
      TBLS_IMAGE: ghcr.io/k1low/tbls@sha256:0d90f07aed0c423a6012d542358c10b13fcdf15a1074ceee3d73676c87cc2f79
    steps:
      - uses: actions/checkout@v7
      - name: Apply golang-migrate SQL migrations to the ephemeral DB
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          for f in $(ls db/migrations/*.up.sql | sort); do
            echo "applying $(basename "$f")"
            psql -h localhost -U postgres -d ktayl_policy -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: ERD drift-check (regenerate from migrations, fail if committed docs are stale)
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work \
            "$TBLS_IMAGE" doc -t mermaid --sort -j "$TBLS_DSN" docs/data-model --force
          if ! git diff --quiet -- docs/data-model; then
            echo "::error::docs/data-model drifted from the DB migrations — regenerate + commit the ERD."
            git --no-pager diff -- docs/data-model | head -80
            exit 1
          fi
          echo "✅ ERD docs are in sync with the migrations"

  # ── L2 — integration tests (Docker Compose, PR to staging only) ───────────
  integration-test:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.13'
          cache: true

      - name: Start Postgres + NATS
        run: docker compose -f tests/integration/docker-compose.yml up -d --wait

      - name: Run integration tests
        run: |
          INTEGRATION_DSN="postgres://ktayl:testpass@localhost:5433/ktayl_policy_test?sslmode=disable" \
          INTEGRATION_NATS_URL="nats://localhost:4223" \
          go test -v -race -count=1 -timeout=120s ./tests/integration/...

      - name: Stop services
        if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v

  # ── Build + push to Harbor ─────────────────────────────────────────────────
  build-and-push:
    needs: [lint, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write          # push prod images to ghcr.io
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      digest:    ${{ steps.build.outputs.digest }}
      branch:    ${{ steps.meta.outputs.branch }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then TAG="${SHA}"; else TAG="${BRANCH}-${SHA}"; fi
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          # Hybrid registry: dev images -> Harbor; prod (main) images ALSO -> ghcr.io
          # (durable, immutable SHA — what Kargo's Warehouse watches).
          HARBOR_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${HARBOR_REF}"$'\n'"${{ env.GHCR_IMAGE }}:${TAG}"
          else
            TAGS="${HARBOR_REF}"
          fi
          { echo "tags<<EOF"; echo "${TAGS}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trust minicloud CA
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" \
            | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Login to GHCR (prod images)
        if: github.ref_name == 'main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: CA_CERT=${{ secrets.MINICLOUD_CA_CERT }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Scan image (Trivy — CRITICAL only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref:      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format:         table
          exit-code:      '1'
          severity:       CRITICAL
          ignore-unfixed: true

      - name: Install Cosign
        if: github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        if: github.ref_name == 'main'
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (CycloneDX JSON)
        if: github.ref_name == 'main'
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} \
            -o cyclonedx-json=sbom.json

      - name: Sign image (keyless — staging + main only)
        if: github.ref_name != 'dev'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to image as OCI referrer
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Prod artifact lives in ghcr.io — sign + attach SBOM there too (same digest).
      - name: Sign ghcr image (keyless)
        if: github.ref_name == 'main'
        run: |
          cosign sign --yes ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Attach SBOM to ghcr image
        if: github.ref_name == 'main'
        run: |
          cosign attach sbom \
            --sbom sbom.json \
            --type cyclonedx \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

  # ── Promotion + dev verification are handled by KARGO, not CI ────────────────
  # CI ends at "build a verified, immutable artifact" (lint, test, integration, Trivy,
  # Cosign, SBOM, dual-push Harbor + ghcr). The dev-branch bump-gitops job is removed —
  # Kargo auto-promotes the main Freight to the dev Stage (ProjectConfig autoPromotionEnabled),
  # runs the dev verification (services/ktayl-policy-service/kargo/analysis-dev-smoke.yaml,
  # a smoke via ingress-nginx), and only a Freight VERIFIED in dev is promotable to prod
  # (CODEOWNERS-gated PR). See services/ktayl-policy-service/kargo/ in minicloud-gitops.
