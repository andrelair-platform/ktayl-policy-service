version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gocritic
    - gofmt
    - gosimple
    - ineffassign
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - encoding/json.NewEncoder.Encode
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      - path: internal/repository/postgres
        linters:
          - errcheck
