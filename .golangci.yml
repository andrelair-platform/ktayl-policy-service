version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - exhaustive
  settings:
    revive:
      rules:
        - name: exported
          severity: warning
    exhaustive:
      default-signifies-exhaustive: true

issues:
  exclusions:
    rules:
      - path: "_test\\.go"
        linters: [errcheck]
