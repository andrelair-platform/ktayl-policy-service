version: "2"
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - gocritic
    - gofmt
    - gosimple
    - ineffassign
    - misspell
linters-settings:
  errcheck:
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - encoding/json.NewEncoder.Encode
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
