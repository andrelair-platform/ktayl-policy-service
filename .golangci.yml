version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gocritic
    - ineffassign
    - misspell
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - encoding/json.NewEncoder.Encode
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - errcheck
      - path: internal/repository/postgres
        linters:
          - errcheck
      - path: internal/documents/pdf_generator.go
        linters:
          - misspell

formatters:
  enable:
    - gofmt
